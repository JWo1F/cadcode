<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cadcode</title>
    <link rel="stylesheet" href="/viewer.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <header class="bar">
      <span class="brand">cadcode</span>
      <span id="file" class="file"></span>
      <label class="part">
        <span>part</span>
        <select id="part"></select>
      </label>
      <span id="status" class="status" data-state="connecting">connecting</span>
      <button id="fit" type="button" title="Fit model to view (F)">Fit</button>
    </header>

    <section id="error" class="error" hidden>
      <pre id="error-text"></pre>
    </section>

    <section id="logs" class="logs" hidden></section>

    <footer class="hint">drag: rotate · shift+drag or right-drag: pan · wheel: zoom · F: fit</footer>

    <script type="module" src="/viewer.js"></script>
  </body>
</html>
